name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install lint tooling
        run: pip install flake8

      - name: Compile check (syntax errors)
        run: python -m py_compile $(git ls-files '*.py')

      - name: Lint (critical errors only)
        run: flake8 --select=E9,F63,F7,F82 --exclude=__pycache__,workspace .
